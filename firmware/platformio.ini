; Issue #5: Grove Color Sensor V3.0（VEML6040）センサ読み取り
; 注: 現行 main.cpp は TCS34725 ライブラリのまま。VEML6040 ドライバ移行予定
; https://github.com/makeOurCity/parking-status-sensor/issues/5

[platformio]
default_envs = xiao-s3

[env]
platform = espressif32
framework = arduino
monitor_speed = 115200
lib_deps =
    adafruit/Adafruit TCS34725@^1.4.4
    adafruit/Adafruit BusIO@^1.16.1

[env:devkit]
board = esp32dev
build_flags = -DBOARD_DEVKIT

[env:xiao-s3]
board = seeed_xiao_esp32s3
build_flags = -DBOARD_XIAO

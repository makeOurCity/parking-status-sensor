; Issue #6: 判定ロジック + MQTT + Deep Sleep
; https://github.com/makeOurCity/parking-status-sensor/issues/6

[platformio]
default_envs = xiao-s3

[env]
platform = espressif32
framework = arduino
monitor_speed = 115200
lib_deps =
    thewknd/VEML6040
    256dpi/MQTT
    bblanchon/ArduinoJson
    vshymanskyy/TinyGSM

[env:xiao-s3]
board = seeed_xiao_esp32s3

[env:xiao-s3-aws]
extends = env:xiao-s3
lib_deps =
    ${env.lib_deps}
    https://github.com/govorox/SSLClient.git
build_flags =
    -DPSS_MQTT_USE_TLS=1
board_build.embed_txtfiles =
    certs/AmazonRootCA1.pem
    certs/device.pem.crt
    certs/private.pem.key

[env:xiao-s3-aws-lte]
extends = env:xiao-s3-aws
build_flags =
    ${env:xiao-s3-aws.build_flags}
    -DPSS_LTE_ENABLED=1
    -DPSS_LTE_ONLY=1
    -DPSS_LTE_MODEM_TLS=1
    ; Phased budgets (docs/sync-delivery-design.md §4.1): cycle 75s = connect 45s + publish 20s + margin.
    -DPSS_MQTT_CONNECT_TIMEOUT_MS=20000
    -DPSS_LTE_NETWORK_TIMEOUT_MS=45000
    -DPSS_TIME_SYNC_TIMEOUT_MS=15000
    -DPSS_CYCLE_MAX_ACTIVE_MS=75000
    -DPSS_CONNECT_PHASE_MS=45000
    -DPSS_PUBLISH_PHASE_MS=20000
    -DPSS_TRANSPORT_MAX_ATTEMPTS=2
    ; #41: reboot if a cycle hangs past the budget instead of stalling forever.
    -DPSS_WATCHDOG_ENABLED=1

; #46: Grove 2-Coil Latching Relay で LTE-M の電源を物理遮断する。
; リレー未配線の他機に誤って流さないよう、xiao-s3-aws-lte とは別envに分離する。
[env:xiao-s3-aws-lte-relay]
extends = env:xiao-s3-aws-lte
build_flags =
    ${env:xiao-s3-aws-lte.build_flags}
    -DPSS_LTE_POWER_RELAY_ENABLED=1
    -DPSS_CHANGE_ONLY_SEND=1
    -DPSS_HEARTBEAT_CYCLES=12

; #46: xiao-s3-aws-lte-relay のベンチ検証用。Deep Sleepを無効化しUSB CDC/Serialを
; 繋ぎっぱなしにする(Deep SleepするとXIAOのネイティブUSB CDCが切断されポートが消える)。
[env:xiao-s3-aws-lte-relay-debug]
extends = env:xiao-s3-aws-lte-relay
build_flags =
    ${env:xiao-s3-aws-lte-relay.build_flags}
    -DPSS_DISABLE_DEEP_SLEEP=1

; #60: 現地調整用ポテンショメーター(Grove - Rotary Angle Sensor)を配線した本番投入機体用。
; 未配線の他機に誤って流さないよう、xiao-s3-aws-lte-relay とは別envに分離する。
[env:xiao-s3-aws-lte-relay-pot]
extends = env:xiao-s3-aws-lte-relay
build_flags =
    ${env:xiao-s3-aws-lte-relay.build_flags}
    -DPSS_POT_ENABLED=1

; #88: LTE-M の電源遮断をロードスイッチ IC（TI TPS22918、hardware/lte-power-switch/）で行う機体用。
; ラッチングリレーの機体に誤って流さないよう、relay 系 env とは別 env に分離する。
; 制御はレベル駆動（HIGH で ON、LOW で OFF）。
[env:xiao-s3-aws-lte-switch-pot]
extends = env:xiao-s3-aws-lte-relay-pot
build_flags =
    ${env:xiao-s3-aws-lte-relay-pot.build_flags}
    -DPSS_LTE_POWER_SWITCH_LEVEL=1

; #88: xiao-s3-aws-lte-switch-pot のベンチ検証用（ポテンショメーターなし、Deep Sleep なし）。
[env:xiao-s3-aws-lte-switch-debug]
extends = env:xiao-s3-aws-lte-relay-debug
build_flags =
    ${env:xiao-s3-aws-lte-relay-debug.build_flags}
    -DPSS_LTE_POWER_SWITCH_LEVEL=1

[env:xiao-s3-aws-lte-debug]
extends = env:xiao-s3-aws-lte
build_flags =
    ${env:xiao-s3-aws-lte.build_flags}
    -DPSS_DISABLE_DEEP_SLEEP=1

[env:xiao-s3-aws-debug]
extends = env:xiao-s3-aws
build_flags =
    ${env:xiao-s3-aws.build_flags}
    -DPSS_DISABLE_DEEP_SLEEP=1

[env:xiao-s3-debug]
extends = env:xiao-s3
build_flags =
    -DPSS_DISABLE_DEEP_SLEEP=1

[env:xiao-s3-lte-test]
extends = env:xiao-s3
build_flags =
    -DPSS_DISABLE_DEEP_SLEEP=1
    -DPSS_LTE_ENABLED=1
    -DPSS_LTE_TEST_MODE=1
    -DPSS_LTE_NETWORK_TIMEOUT_MS=120000
    -DTINY_GSM_DEBUG=Serial

; #40: Grove Wio-E5 LoRaWAN 版（LTE-M と Grove UART を共有するため排他）。
; 変化時のみ送信 + heartbeat（#39/#46）と電源投入時のブートモード（#50）は LTE-M 版と同じ。
; 予算は実測（Join 約6s、ACK 付き送信 約2s、docs/40-lorawan-design.md §4）から:
; connect 30s = Join 最大 12s × 3 回、publish 25s = 送信 最大 8s × 3 回、
; cycle 60s + watchdog margin 20s = 80s。
[env:xiao-s3-lorawan]
extends = env:xiao-s3
build_flags =
    -DPSS_LORAWAN_ENABLED=1
    -DPSS_CHANGE_ONLY_SEND=1
    -DPSS_HEARTBEAT_CYCLES=12
    -DPSS_TRANSPORT_MAX_ATTEMPTS=3
    -DPSS_CONNECT_PHASE_MS=30000
    -DPSS_PUBLISH_MAX_ATTEMPTS=3
    -DPSS_PUBLISH_PHASE_MS=25000
    -DPSS_CYCLE_MAX_ACTIVE_MS=60000
    -DPSS_WATCHDOG_ENABLED=1
    ; UART0 (GPIO43 = Wio-E5 RX) must not carry core debug logs.
    -DCORE_DEBUG_LEVEL=0

; 上のベンチ検証用。Deep Sleep を無効化し USB シリアルをつなぎっぱなしにする。
[env:xiao-s3-lorawan-debug]
extends = env:xiao-s3-lorawan
build_flags =
    ${env:xiao-s3-lorawan.build_flags}
    -DPSS_DISABLE_DEEP_SLEEP=1

; #60: ポテンショメーター(Grove - Rotary Angle Sensor、D1)を配線した LoRaWAN 版。
; 未配線の機体に誤って流さないよう、xiao-s3-lorawan とは別envに分離する。
[env:xiao-s3-lorawan-pot]
extends = env:xiao-s3-lorawan
build_flags =
    ${env:xiao-s3-lorawan.build_flags}
    -DPSS_POT_ENABLED=1

; #40 PR1: Grove Wio-E5 AT probe + USB serial passthrough (no sensor / no send).
[env:xiao-s3-lorawan-test]
extends = env:xiao-s3
build_flags =
    -DPSS_DISABLE_DEEP_SLEEP=1
    -DPSS_LORAWAN_ENABLED=1
    -DPSS_LORAWAN_TEST_MODE=1
    ; UART0 (GPIO43 = Wio-E5 RX) must not carry core debug logs.
    -DCORE_DEBUG_LEVEL=0

; #25 Phase 0: modem poweroff + recover only (no MQTT / no Deep Sleep).
[env:xiao-s3-lte-poweroff-test]
extends = env:xiao-s3
build_flags =
    -DPSS_DISABLE_DEEP_SLEEP=1
    -DPSS_LTE_ENABLED=1
    -DPSS_LTE_POWEROFF_TEST_MODE=1
    -DPSS_LTE_NETWORK_TIMEOUT_MS=120000
    -DPSS_LTE_POWEROFF_OBSERVE_MS=30000
    -DTINY_GSM_DEBUG=Serial

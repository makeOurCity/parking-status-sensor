; Issue #5: Grove Color Sensor V3.0（VEML6040）センサ読み取り
; https://github.com/makeOurCity/parking-status-sensor/issues/5

[platformio]
default_envs = xiao-s3

[env]
platform = espressif32
framework = arduino
monitor_speed = 115200
lib_deps =
    thewknd/VEML6040

[env:xiao-s3]
board = seeed_xiao_esp32s3

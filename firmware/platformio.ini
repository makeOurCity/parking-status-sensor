; Issue #6: 判定ロジック + MQTT + Deep Sleep
; https://github.com/makeOurCity/parking-status-sensor/issues/6

[platformio]
default_envs = xiao-s3

[env]
platform = espressif32
framework = arduino
monitor_speed = 115200
lib_deps =
    thewknd/VEML6040
    256dpi/MQTT
    bblanchon/ArduinoJson
    vshymanskyy/TinyGSM

[env:xiao-s3]
board = seeed_xiao_esp32s3

[env:xiao-s3-debug]
extends = env:xiao-s3
build_flags =
    -DPSS_DISABLE_DEEP_SLEEP=1

[env:xiao-s3-lte-test]
extends = env:xiao-s3
build_flags =
    -DPSS_DISABLE_DEEP_SLEEP=1
    -DPSS_LTE_ENABLED=1
    -DPSS_LTE_TEST_MODE=1
    -DPSS_LTE_NETWORK_TIMEOUT_MS=120000
    -DTINY_GSM_DEBUG=Serial

; Issue #5: TCS34725 センサ読み取り（DevKit 第1段階 / XIAO 第2段階）
; https://github.com/makeOurCity/parking-status-sensor/issues/5

[platformio]
default_envs = devkit

[env]
platform = espressif32
framework = arduino
monitor_speed = 115200
lib_deps =
    adafruit/Adafruit TCS34725@^1.4.4
    adafruit/Adafruit BusIO@^1.16.1

[env:devkit]
board = esp32dev
build_flags = -DBOARD_DEVKIT
lib_deps =
    ${env.lib_deps}
    adafruit/Adafruit SSD1306@^2.5.9
    adafruit/Adafruit GFX Library@^1.11.9

[env:xiao-s3]
board = seeed_xiao_esp32s3
build_flags = -DBOARD_XIAO

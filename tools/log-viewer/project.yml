name: LogViewer
options:
  bundleIdPrefix: org.code4japan.parkingsensor
  deploymentTarget:
    iOS: "17.0"
  createIntermediateGroups: true
targets:
  LogViewer:
    type: application
    platform: iOS
    sources:
      - path: LogViewer
    info:
      path: LogViewer/Info.plist
      properties:
        UILaunchScreen: {}
        CFBundleShortVersionString: "$(MARKETING_VERSION)"
        CFBundleVersion: "$(CURRENT_PROJECT_VERSION)"
        ITSAppUsesNonExemptEncryption: false
        UISupportedInterfaceOrientations:
          - UIInterfaceOrientationPortrait
        UISupportedInterfaceOrientations~ipad:
          - UIInterfaceOrientationPortrait
          - UIInterfaceOrientationPortraitUpsideDown
          - UIInterfaceOrientationLandscapeLeft
          - UIInterfaceOrientationLandscapeRight
        UIBackgroundModes:
          - fetch
        BGTaskSchedulerPermittedIdentifiers:
          - org.code4japan.parkingsensor.logviewer.refresh
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: org.code4japan.parkingsensor.logviewer
        # TestFlight は同じビルド番号を再アップロードできない。CI は CURRENT_PROJECT_VERSION を
        # 上書きして渡す（.github/workflows/testflight-log-viewer.yml）。ここは手元ビルドの既定値。
        MARKETING_VERSION: "1.0"
        CURRENT_PROJECT_VERSION: "1"
        TARGETED_DEVICE_FAMILY: "1,2"
        SUPPORTS_MACCATALYST: false
        DEVELOPMENT_TEAM: ""
        CODE_SIGN_STYLE: Automatic
        SWIFT_VERSION: "5.0"
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
    scheme:
      testTargets:
        - LogViewerTests
  # 集計の純粋関数など、画面から切り離したロジックの試験（#132）。
  LogViewerTests:
    type: bundle.unit-test
    platform: iOS
    sources:
      - path: LogViewerTests
    dependencies:
      - target: LogViewer
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: org.code4japan.parkingsensor.logviewer.tests
        GENERATE_INFOPLIST_FILE: YES
        SWIFT_VERSION: "5.0"
        DEVELOPMENT_TEAM: ""
        CODE_SIGN_STYLE: Automatic

; Issue #31: U200-1A (INA226 @ 0x41) + SSD1306 OLED on ESP32 DevKit
; https://github.com/makeOurCity/parking-status-sensor/issues/31

[env:logger-devkit]
platform = espressif32
board = esp32dev
framework = arduino
monitor_speed = 115200
lib_deps =
    robtillaart/INA226@^0.6.4
    adafruit/Adafruit SSD1306@^2.5.9
    adafruit/Adafruit GFX Library@^1.11.9
build_flags =
    -DLOGGER_I2C_SDA=21
    -DLOGGER_I2C_SCL=22
    -DLOGGER_OLED_ADDR=0x3C
    -DLOGGER_SAMPLE_HZ=15
    -DLOGGER_OLED_INTERVAL_MS=250

; Issue #74: 瞬間的な電圧低下（LTE-M通電時の突入電流など）を捉える高速モード。
; INA226を変換140us・平均なしで連続読み取りし、50msごとに最低電圧・最大電流を出力する。
; https://github.com/makeOurCity/parking-status-sensor/issues/74
[env:logger-devkit-fast]
extends = env:logger-devkit
build_flags =
    -DLOGGER_I2C_SDA=21
    -DLOGGER_I2C_SCL=22
    -DLOGGER_OLED_ADDR=0x3C
    -DLOGGER_OLED_INTERVAL_MS=1000
    -DLOGGER_FAST_MODE=1
    -DLOGGER_WINDOW_MS=50
    -DLOGGER_I2C_HZ=400000
    -DLOGGER_OLED_IDLE_MA=5.0f

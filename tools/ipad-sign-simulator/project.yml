name: SignSimulator
options:
  bundleIdPrefix: org.code4japan.parkingsensor
  deploymentTarget:
    iOS: "17.0"
  createIntermediateGroups: true
targets:
  SignSimulator:
    type: application
    platform: iOS
    sources:
      - path: SignSimulator
    info:
      path: SignSimulator/Info.plist
      properties:
        UILaunchScreen: {}
        UIRequiresFullScreen: true
        UISupportedInterfaceOrientations:
          - UIInterfaceOrientationLandscapeLeft
          - UIInterfaceOrientationLandscapeRight
        UISupportedInterfaceOrientations~ipad:
          - UIInterfaceOrientationLandscapeLeft
          - UIInterfaceOrientationLandscapeRight
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: org.code4japan.parkingsensor.signsimulator
        TARGETED_DEVICE_FAMILY: "2"
        SUPPORTS_MACCATALYST: false
        DEVELOPMENT_TEAM: ""
        CODE_SIGN_STYLE: Automatic
        SWIFT_VERSION: "5.0"
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
